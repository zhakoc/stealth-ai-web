<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stealtH AI - Giris</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="logo"><span class="pink">stealt</span><span class="purple">H</span> <span class="dim">AI</span></h1>
                <p class="subtitle">Yapay zeka asistaniniza giris yapin</p>
            </div>
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            <form method="POST" class="auth-form">
                <div class="input-group">
                    <label>KULLANICI ADI</label>
                    <input type="text" name="username" placeholder="Kullanici adinizi girin" required autofocus>
                </div>
                <div class="input-group">
                    <label>SIFRE</label>
                    <input type="password" name="password" placeholder="Sifrenizi girin" required>
                </div>
                <button type="submit" class="btn btn-primary">GIRIS YAP</button>
            </form>
            <div class="auth-footer">
                Hesabiniz yok mu? <a href="{{ url_for('register') }}">Kayit Ol</a>
            </div>
        </div>
    </div>
</body>
</html>
